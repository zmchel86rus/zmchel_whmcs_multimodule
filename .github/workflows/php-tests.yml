name: PHP tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}

      - name: Check syntax of every PHP file
        run: |
          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
          done < <(git ls-files -z '*.php')

      - name: Run standalone tests
        run: |
          php tests/contact_schema.php
          php tests/images.php
          php tests/page_urls.php
          php tests/page_urls.php --br
          php tests/page_urls.php --pretty
          php tests/page_urls.php --pretty --br
          php tests/page_urls.php --default-route
          php tests/page_urls.php --pretty --default-route
          php tests/rewrite.php
          php tests/rewrite.php --default-route
          php tests/rewrite.php --routes-off
          php tests/smarty_admin_guard.php
          php tests/content_links.php
          php tests/table_of_contents.php
          php tests/language_manager.php
          for language in rep_info/*/; do
            php tests/readme_loader.php "$(basename "$language")"
          done
          php tests/documentation.php
